version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberquant_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Member 1: FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberquant_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cyberquant_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - MOCK_DATA_PATH=/app/mock_data.json
    volumes:
      - ./mock_data.json:/app/mock_data.json:ro
    depends_on:
      - postgres
      - redis
      - neo4j
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Celery Background Worker Service (Phase 8 Foundation)
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberquant_celery_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cyberquant_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: cyberquant_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cyberquant_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Member 2 Infrastructure: Neo4j Graph Database Service
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.12-community
    container_name: cyberquant_neo4j
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/cyberquant_secure_pass
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Redis Cache & Celery Broker Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberquant_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
