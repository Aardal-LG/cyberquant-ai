version: '3.8'

services:
  # 1. Next.js Frontend Dashboard
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 2. FastAPI & AI Engine
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/cyberquant
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - postgres
      - redis
      - neo4j

  # 3. PostgreSQL (Historical & Relational Data)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cyberquant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 4. Neo4j (Security Graph Topology)
  neo4j:
    image: neo4j:community
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt API
    volumes:
      - neo4jdata:/data

  # 5. Redis (Background Task Queueing)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  neo4jdata:
